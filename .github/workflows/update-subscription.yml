name: Update TURN subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-turn-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate subscription
        run: python scripts/build_subscription.py
      - name: Commit updated subscription
        run: |
          if git diff --quiet -- subscribe.txt; then
            echo "Subscription is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscribe.txt
          git commit -m "chore: refresh TURN subscription"
          git push
